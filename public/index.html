<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banner Ao Vivo no Rio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: transparent;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 24px 12px;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { width: 240px; }

  /* Banner 240 x 350 */
  .stage { width: 240px; height: 350px; perspective: 900px; }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.45,.05,.25,1);
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 14px 14px; text-align: center;
    border-radius: 10px; overflow: hidden;
  }
  .front {
    background: #e50914;
    color: #fff; transform: rotateY(0deg);
    gap: 0; padding: 20px 18px 18px;
  }
  .front::after { /* moldura fina interna */
    content: ""; position: absolute; inset: 7px; pointer-events: none;
    border: 1px solid rgba(255,255,255,.30); border-radius: 7px;
  }
  .back  {
    background: #39ff14; color: #000; transform: rotateY(180deg);
    gap: 0; padding: 20px 18px 18px;
  }
  .back::after { /* moldura fina interna */
    content: ""; position: absolute; inset: 7px; pointer-events: none;
    border: 1px solid rgba(0,0,0,.35); border-radius: 7px;
  }
  .back h1 {
    margin: 0 0 12px; font-family: "Anton", Impact, "Arial Narrow Bold", sans-serif; font-weight: 400;
    font-size: 34px; line-height: 1.04; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; color: #000;
  }
  .front .handle { background: #fff; color: #e50914; }
  .back .handle { background: #000; color: #39ff14; font-size: 13.5px; }
  .back .url { text-transform: uppercase; }

  .yt { margin-bottom: 9px; }
  .front h1 {
    margin: 0 0 12px; font-family: "Anton", Impact, "Arial Narrow Bold", sans-serif; font-weight: 400;
    font-size: 38px; line-height: 1; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap;
  }
  .qrf {
    width: 136px; height: 136px; padding: 9px; background: #fff; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .qrf img, .qrf canvas { max-width: 100%; max-height: 100%; display: block; }
  .handle {
    margin-top: 14px; padding: 7px 16px; border-radius: 999px;
    font-family: "Montserrat", "Segoe UI", Arial, sans-serif; font-weight: 800; font-size: 15px;
    letter-spacing: .05em; line-height: 1.1; white-space: nowrap;
  }
  .url {
    margin-top: 9px; font-family: "Montserrat", "Segoe UI", Arial, sans-serif; font-weight: 600;
    font-size: 9.5px; letter-spacing: .09em; opacity: .88;
  }

  .qr-slot { cursor: pointer; font: 600 10px "Montserrat", "Segoe UI", Arial, sans-serif; letter-spacing: .04em; color: #000; text-align: center; line-height: 1.4; text-transform: uppercase; }
  .qr-slot input { display: none; }

  /* Relógio */
  .clock {
    margin-top: 12px; text-align: center; color: #fff; background: transparent;
    font-family: "Courier New", monospace; user-select: none;
  }
  .clock .time { font-size: 38px; font-weight: bold; letter-spacing: 2px; }
  .clock .date { font: 13px Arial, sans-serif; opacity: .85; margin-top: 2px; }
  .clock .tz { font: 11px Arial, sans-serif; opacity: .6; margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) { .card { transition-duration: .01s; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="card" id="card">

        <!-- Banner 1: vermelho -->
        <div class="face front">
          <svg class="yt" width="46" height="32" viewBox="0 0 46 32" role="img" aria-label="YouTube" xmlns="http://www.w3.org/2000/svg"><rect width="46" height="32" rx="9" fill="#ffffff"/><path d="M18 9 L32 16 L18 23 Z" fill="#e50914"/></svg>
          <h1>Inscreva-se</h1>
          <div class="qrf" id="qr-youtube"></div>
          <div class="handle">@AOVIVONORIO</div>
          <div class="url">youtube.com/@aovivonorio</div>
        </div>

        <!-- Banner 2: verde neon com preto -->
        <div class="face back">
          <h1>Ajude com o<br>transporte</h1>
          <div class="qrf" id="qr-transporte">
            <label class="qr-slot" id="slot">
              Toque aqui para<br>carregar o QR code<br>em anexo
              <input type="file" accept="image/*" id="file">
            </label>
          </div>
          <div class="handle">livepix.gg/aovivonorio</div>
          <div class="url">Aponte a câmera do celular</div>
        </div>

      </div>
    </div>

    <div class="clock" aria-live="off">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
  </div>

  // QR code do canal do YouTube
  try {
    new QRCode(document.getElementById("qr-youtube"), {
      text: "https://www.youtube.com/@aovivonorio",
      width: 118, height: 118,
      colorDark: "#000000", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch (e) {
    document.getElementById("qr-youtube").textContent = "youtube.com/@aovivonorio";
  }

  // QR code do transporte (imagem em anexo)
  function mostrarQR(src) {
    var box = document.getElementById("qr-transporte");
    box.innerHTML = "";
    var img = new Image();
    img.src = src; img.alt = "QR code para ajudar com o transporte";
    box.appendChild(img);
  }
  if (QR_TRANSPORTE) {
    mostrarQR(QR_TRANSPORTE);
  } else {
    document.getElementById("file").addEventListener("change", function (ev) {
      var f = ev.target.files && ev.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { mostrarQR(r.result); };
      r.readAsDataURL(f);
    });
  }

  // Giro entre os banners
  var angulo = 0;
  var card = document.getElementById("card");
  setInterval(function () {
    angulo += 180;
    card.style.transform = "rotateY(" + angulo + "deg)";
  }, INTERVALO_MS);

  // Relógio – horário oficial do Brasil (Brasília)
  var fmtHora = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  var fmtData = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  function tick() {
    var agora = new Date();
    document.getElementById("time").textContent = fmtHora.format(agora);
    document.getElementById("date").textContent = fmtData.format(agora);
  }
  tick(); setInterval(tick, 1000);
